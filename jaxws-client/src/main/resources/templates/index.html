<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Directors reports</title>
    <style>
        body {
            margin: 0;
            padding: 48px 20px;
            font-family: "Segoe UI", Verdana, Arial, sans-serif;
            background-color: #f4f1ec;
            color: #2b2b2b;
        }

        main {
            max-width: 640px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 28px 0;
        }

        .reports {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .reports input {
            position: absolute;
            opacity: 0;
        }

        .reports label {
            display: block;
            padding: 16px;
            border: 2px solid #e2ddd4;
            border-radius: 10px;
            background-color: #ffffff;
            font-weight: 600;
            cursor: pointer;
        }

        .reports input:checked + label {
            border-color: #3d3a4b;
            background-color: #ebe8f3;
        }

        .reports input:focus-visible + label {
            outline: 3px solid #3d3a4b;
            outline-offset: 2px;
        }

        .choice {
            display: none;
            margin-top: 20px;
        }

        .choice.visible {
            display: block;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2ddd4;
            border-radius: 8px;
            background-color: #ffffff;
            font-family: inherit;
            font-size: 15px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .buttons button {
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            background-color: #3d3a4b;
            color: #ffffff;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .buttons button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
<main>
    <h1>Directors reports</h1>

    <form id="report-form">
        <div class="reports">
            <div>
                <input type="radio" id="all-directors" name="type" value="all-directors" checked>
                <label for="all-directors">All directors</label>
            </div>
            <div>
                <input type="radio" id="by-genre" name="type" value="by-genre">
                <label for="by-genre">Directors by genre</label>
            </div>
            <div>
                <input type="radio" id="one-director" name="type" value="one-director">
                <label for="one-director">One director</label>
            </div>
            <div>
                <input type="radio" id="all-movies" name="type" value="all-movies">
                <label for="all-movies">All movies</label>
            </div>
            <div>
                <input type="radio" id="director-movies" name="type" value="director-movies">
                <label for="director-movies">Movies of a director</label>
            </div>
        </div>

        <div class="choice" id="genre-choice">
            <select id="genre" aria-label="Genre">
                <option value="S">Sci-fi</option>
                <option value="A">Adventure</option>
                <option value="C">Crime</option>
                <option value="D">Drama</option>
                <option value="T">Thriller</option>
            </select>
        </div>

        <div class="choice" id="director-choice">
            <select id="director" aria-label="Director">
                <option value="1">Christopher Nolan</option>
                <option value="2">Steven Spielberg</option>
                <option value="3">Quentin Tarantino</option>
                <option value="4">Greta Gerwig</option>
                <option value="5">Denis Villeneuve</option>
                <option value="6">Alfred Hitchcock</option>
            </select>
        </div>

        <div class="buttons">
            <button type="button" data-format="html" href="/directors.html">HTML</button>
            <button type="button" data-format="pdf" href="/directors.pdf">PDF</button>
        </div>
    </form>
</main>

<script>
    const form = document.getElementById("report-form");

    function selectedType() {
        return form.elements["type"].value;
    }

    function buildUrl(format) {
        const genre = document.getElementById("genre").value;
        const director = document.getElementById("director").value;

        switch (selectedType()) {
            case "by-genre":
                return "/directors/" + format + "?genre=" + genre;
            case "one-director":
                return "/director/" + format + "?id=" + director;
            case "all-movies":
                return "/movies/" + format;
            case "director-movies":
                return "/movies/" + format + "?directorId=" + director;
            default:
                return "/directors/" + format;
        }
    }

    function showChoice() {
        const type = selectedType();
        document.getElementById("genre-choice").classList.toggle("visible", type === "by-genre");
        document.getElementById("director-choice").classList.toggle("visible",
            type === "one-director" || type === "director-movies");
    }

    form.addEventListener("change", showChoice);

    document.querySelectorAll(".buttons button").forEach(button => {
        button.addEventListener("click", () => {
            window.open(buildUrl(button.dataset.format), "_blank");
        });
    });

    showChoice();
</script>
</body>
</html>
