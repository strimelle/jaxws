<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Directors</title>
    <style>
        :root {
            --background: #f4f1ec;
            --card: #ffffff;
            --text: #2b2b2b;
            --muted: #7a7a7a;
            --accent: #3d3a4b;
            --accent-text: #ffffff;
            --border: #e6e2da;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #1e1d24;
                --card: #2a2833;
                --text: #ececec;
                --muted: #a8a6b3;
                --accent: #8f86c9;
                --accent-text: #1e1d24;
                --border: #3b3946;
            }
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Verdana, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
        }

        main {
            max-width: 640px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 4px 0;
        }

        .subtitle {
            margin: 0 0 32px 0;
            color: var(--muted);
        }

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px 24px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin: 0 0 6px 0;
            font-size: 18px;
        }

        .card p {
            margin: 0 0 16px 0;
            color: var(--muted);
            font-size: 14px;
        }

        .button,
        button {
            display: inline-block;
            margin: 0 8px 8px 0;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background-color: var(--accent);
            color: var(--accent-text);
            font-family: inherit;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        .button:hover,
        button:hover {
            opacity: 0.85;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        select {
            width: 100%;
            margin-bottom: 14px;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: var(--card);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
        }
    </style>
</head>
<body>
<form action="#" th:action="@{/greeting}" th:object="${greeting}" method="post">
<main>
    <h1>Directors</h1>
    <p class="subtitle">Reports about film directors and their movies</p>

    <section class="card">
        <h2>All directors</h2>
        <p>Report with all directors and their movies.</p>

        <!-- TODO: put the address of the HTML report endpoint in href -->
        <a class="button" href="#">Get HTML</a>

        <!-- TODO: put the address of the PDF report endpoint in href -->
        <a class="button" href="#">Get PDF</a>
    </section>

    <section class="card">
        <h2>Directors by genre</h2>
        <p>Report with directors of the selected main genre.</p>

        <!-- TODO: put the address of the PDF report endpoint in action -->
        <form action="#" method="get">
            <label for="genre">Main genre</label>
            <select id="genre" name="genre">
                <option value="S">Sci-fi</option>
                <option value="A">Adventure</option>
                <option value="C">Crime</option>
                <option value="D">Drama</option>
                <option value="T">Thriller</option>
            </select>

            <!-- TODO: put the address of the HTML report endpoint in formaction -->
            <button type="submit" formaction="#">Get HTML</button>
            <button type="submit">Get PDF</button>
        </form>
    </section>
</main>
</form>
</body>
</html>
